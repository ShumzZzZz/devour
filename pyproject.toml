[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start with Ruff’s defaults (Pyflakes + essential pycodestyle), then add popular extras.
select = [
    "E4", "E7", "E9", "F",   # core
    "B",                     # flake8-bugbear
    "I",                     # import sorting
    "ISC",                   # implicit string concat
    "UP"                     # pyupgrade-like modernizations
]
ignore = [
    "E501",              # let formatter handle wrapping best-effort
    "F403",
    "F405"
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]   # example: allow `assert` in tests if you enable security rules later


[tool.ruff.format]
# Ruff formatter (a fast, Black-compatible formatter) with a few tweakable knobs.
quote-style = "double"       # "double" (Black-like) or "single"
indent-style = "space"       # "space" or "tab"
docstring-code-format = true