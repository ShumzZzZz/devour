[project]
name = "ml-infr-ops"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "pyspark",
    "feast[redis, spark, duckdb]==0.51.0"
]

[dependency-groups]
dev = [
  "ruff==0.12.*",
  "pyright==1.1.*",
  "pytest==8.4.*",
  "pytest-cov==6.2.*",
  "coverage==7.10.*",
]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  "infra",
  "mlops",
  "tofu",
  "demo_project",
  "jenkins",
  "**/*.ipynb",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "ISC", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docker"]
addopts = [
  "-ra",
  "-v",
  "--strict-markers",
#  "--cov=docker/devour_feature_store",
#  "--cov-report=term-missing"
]
filterwarnings = ["error::DeprecationWarning"]

