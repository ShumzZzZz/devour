apiVersion: v1
kind: Secret
metadata:
  name: feast-data-stores
  namespace: feast
stringData:
  redis: |
    type: redis
    connection_string: "${redisUrl},ssl=true,password=${redisPassword}"
    redis_type: redis_cluster
  sql: |
    path: postgresql+psycopg://${postgresUser}:${postgresPassword}@postgres-service.feast.svc.cluster.local:5432/${postgresDb}
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true
---
apiVersion: feast.dev/v1alpha1
kind: FeatureStore
metadata:
  name: mle
  namespace: feast
spec:
  feastProject: devour
  feastProjectDir:
    packaged:
      featureRepoPath: "/feast-data-customize/devour/"
  services:
    deploymentStrategy:
      type: RollingUpdate
    registry:
      local:
        persistence:
          store:
            type: sql
            secretRef:
              name: feast-data-stores
        server:
          envFrom:
          - secretRef:
              name: feast-secrets
          - configMapRef:
              name: feast-config
          logLevel: debug
          image: "${devourServerImage}"
          imagePullPolicy: "Always"
    offlineStore:
      persistence:
        file:
          type: duckdb
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-data-stores
      server:
        envFrom:
        - secretRef:
            name: feast-secrets
        - configMapRef:
            name: feast-config
        env:
        - name: MPLCONFIGDIR
          value: /tmp
        resources:
          requests:
            cpu: 800m
            memory: 20Gi
          limits:
            cpu: 1500m
            memory: 20Gi
        logLevel: debug
        image: "${devourServerImage}"
        imagePullPolicy: "Always"
    ui:
      envFrom:
      - secretRef:
          name: feast-secrets
      - configMapRef:
          name: feast-config
      logLevel: debug
      image: "${devourServerImage}"
      imagePullPolicy: "Always"

