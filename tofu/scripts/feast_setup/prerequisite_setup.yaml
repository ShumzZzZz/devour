apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: githubapp-creds
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: githubapp-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          jenkins.io/credentials-type: githubApp
          jenkins.io/credentials-scope: global
        annotations:
          jenkins.io/credentials-description: "GitHub App for Jenkins (from AWS Secrets Manager)"
      data:
        appId: "{{ .appId }}"
        privateKey: "{{ .privateKey }}"
  data:
    - secretKey: appId
      remoteRef: { key: mle/github-app-sk, property: appId }
    - secretKey: privateKey
      remoteRef: { key: mle/github-app-sk, property: privateKey }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-creds
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: dockerhub-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          jenkins.io/credentials-type: usernamePassword
          jenkins.io/credentials-scope: global
        annotations:
          jenkins.io/credentials-description: "Docker Hub credentials for Jenkins (from AWS Secrets Manager)"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: mle/dockerhub-creds, property: username }
    - secretKey: password
      remoteRef: { key: mle/dockerhub-creds, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feast-creds
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: feast-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          jenkins.io/credentials-type: usernamePassword
          jenkins.io/credentials-scope: global
        annotations:
          jenkins.io/credentials-description: "Feast credentials for Jenkins (from AWS Secrets Manager)"
      data:
        redisUrl: "{{ .redisUrl }}"
        redisPassword: "{{ .redisPassword }}"
        postgresPassword: "{{ .postgresPassword }}"
  data:
    - secretKey: redisUrl
      remoteRef: { key: mle/feast-creds, property: redisUrl }
    - secretKey: redisPassword
      remoteRef: { key: mle/feast-creds, property: redisPassword }
    - secretKey: postgresPassword
      remoteRef: { key: mle/feast-creds, property: postgresPassword }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feast-secrets
  namespace: feast
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets
  target:
    name: feast-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        redisUrl: "{{ .redisUrl }}"
        redisPassword: "{{ .redisPassword }}"
        postgresPassword: "{{ .postgresPassword }}"
  data:
    - secretKey: redisUrl
      remoteRef: { key: mle/feast-creds, property: redisUrl }
    - secretKey: redisPassword
      remoteRef: { key: mle/feast-creds, property: redisPassword }
    - secretKey: postgresPassword
      remoteRef: { key: mle/feast-creds, property: postgresPassword }
---
# Configure container storage interface
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aws-ebs-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp3  # or gp2, io1, etc. based on your requirements
reclaimPolicy: Delete # Retain
volumeBindingMode: WaitForFirstConsumer
---
